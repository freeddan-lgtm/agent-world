<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1a0b3d">
<meta http-equiv="refresh" content="2;url=https://thou-earliest-aid-companies.trycloudflare.com/">
<title>Opening Agent World…</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
    background:radial-gradient(1200px 800px at 50% 20%,#3b1478 0%,#1a0b3d 55%,#0d0622 100%);
    color:#f5f3ff;font:600 20px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .dot{width:14px;height:14px;border-radius:50%;background:#a855f7;box-shadow:0 0 24px #a855f7;animation:p 1.1s ease-in-out infinite}
  @keyframes p{50%{transform:scale(.6);opacity:.5}}
  a{color:#c4b5fd;font-weight:500;font-size:16px}
  small{color:#8e87b5;font-weight:400;font-size:13px}
</style>
</head>
<body>
<div class="dot"></div>
<div>Opening Agent World…</div>
<a id="go" href="https://thou-earliest-aid-companies.trycloudflare.com/">Tap here if it doesn't open</a>
<small>You'll be asked to log in.</small>
<script>
(function () {
  var url = "https://thou-earliest-aid-companies.trycloudflare.com/";
  var done = false;
  function go(u) { if (done) return; done = true; document.getElementById("go").href = u; location.replace(u); }
  var ok = /^https:\/\/[a-z0-9][a-z0-9-]*\.(trycloudflare\.com|lhr\.life)\/$/;
  setTimeout(function () { go(url); }, 1200);
  try {
    fetch("target.json?ts=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) { go(j && ok.test(j.url) ? j.url : url); })
      .catch(function () { go(url); });
  } catch (e) { go(url); }
})();
</script>
</body>
</html>
